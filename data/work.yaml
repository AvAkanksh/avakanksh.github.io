research:
  - title: "Implied Volatility Surface Forecasting"
    period: "Aug 2025 – Aug 2026"
    sort: 2026.8
    focus: quant
    lead: true
    venue: "Master's thesis at the IITB Citadel Research Lab, submitted to the 7th International Conference on AI in Finance."
    guide: ""
    body: |
      A volatility surface that violates butterfly convexity or calendar monotonicity is not just
      inaccurate, it is a free arbitrage — so the forecast has to respect the shape of the object,
      not only fit its values. I evaluate two spatio-temporal architectures, AF-TransVol and
      AF-INO, over 3,417 trading days of NSE NIFTY 50 options, feeding them 44 causal market and
      stress scalars plus three soft regime probabilities under a scale-invariant log-IV transform
      and (ρ, z) warping. The no-arbitrage constraints are enforced in the loss, and a
      stress-conditioned variant handles the regimes where surfaces usually break.
    metrics:
      - value: "5.30%"
        label: "MAPE, state of the art on this benchmark"
      - value: "0.910"
        label: "R² across the surface"
      - value: "−50%"
        label: "static arbitrage violations"
    tags: ["GANs", "Diffusion models", "Neural operators", "No-arbitrage constraints", "NIFTY 50"]

  - title: "PARAM-1: an Indic-scale foundation model"
    period: "Jan – May 2025"
    sort: 2025.1
    focus: ml
    venue: "Written up as an R&D seminar at IIT Bombay, for the BharatGen consortium."
    guide: "Prof. Ganesh Ramakrishnan"
    body: |
      PARAM-1 is a 2.9B-parameter English–Hindi bilingual model trained from scratch on 5 trillion
      tokens. I worked on the data side: a curation pipeline in NVIDIA NeMo over FineWeb, DCLM and
      Dolma, fastText quality classifiers, GPU-accelerated fuzzy deduplication, code and maths
      filtration, PII removal, and custom scrapers for archive.org to reach Indic text the open
      corpora miss.
    metrics:
      - value: "2.9B"
        label: "parameters, trained from scratch"
      - value: "5T"
        label: "training tokens"
      - value: "12TB"
        label: "text curated and deduplicated"
    tags: ["NVIDIA NeMo", "Data curation", "fastText", "Deduplication", "Hindi"]

