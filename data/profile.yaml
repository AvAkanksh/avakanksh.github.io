about: |
  I am an M.S. by Research student at the Centre for Machine Intelligence and Data Science,
  IIT Bombay, finishing a thesis on no-arbitrage implied volatility surface forecasting at the
  IITB Citadel Research Lab.

  Before IIT Bombay I spent a year at Paytm building backend services for field sales and
  revenue automation, and a summer at Holmusk in Singapore on clinical outcome models. I
  started in Electrical Engineering at IIT Tirupati, which is where the robotics competitions
  further down this page come from.

  The common thread is that I like problems where the correctness bar is explicit — an
  arbitrage constraint that must hold, a float tolerance of 1e-12, a thread sanitizer that must
  stay quiet. I am looking for quantitative research, machine learning and systems roles where
  that is the standard.

