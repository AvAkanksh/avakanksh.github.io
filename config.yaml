# Site configuration. The page content lives in data/*.yaml:
#   data/profile.yaml   identity, hero copy, skills
#   data/work.yaml      research, experience, education, responsibilities, competitions
#   data/projects.yaml  featured projects, earlier work, open-source repositories
#   data/resumes.yaml   résumé variants (drop the PDF in static/resume/ first)

baseURL: "https://avakanksh.github.io/"
languageCode: "en-us"
title: "Av Akanksh"

enableRobotsTXT: true
enableGitInfo: false
disableKinds: ["taxonomy", "term", "RSS", "section"]

outputs:
  home: ["HTML"]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

minify:
  disableXML: true
  minifyOutput: true

params:
  # The left-hand navigation. `id` must match a section id in layouts/partials/sections.
  sections:
    - id: work
      label: "Research"
    - id: projects
      label: "Projects"
    - id: opensource
      label: "Open source"
    - id: about
      label: "About"
    - id: resumes
      label: "Résumés"
    - id: record
      label: "Record"
    - id: contact
      label: "Contact"
