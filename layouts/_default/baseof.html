<!doctype html>
<html lang="{{ site.LanguageCode | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {{ partial "nav.html" . }}
  <main class="wrap" id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}

  {{- $gsap := "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0" }}
  <script src="{{ $gsap }}/gsap.min.js" defer></script>
  <script src="{{ $gsap }}/ScrollTrigger.min.js" defer></script>
  <script src="{{ $gsap }}/SplitText.min.js" defer></script>
  {{- with resources.Get "js/site.js" }}
    {{- $js := . | minify | fingerprint -}}
    <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
  {{- end }}
</body>
</html>
