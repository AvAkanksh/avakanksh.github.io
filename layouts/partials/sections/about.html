{{- $p := site.Data.profile -}}
<section class="section" id="about">
  {{ partial "section-head.html" (dict "title" "About") }}
  <div class="entry-text">{{ $p.about | markdownify }}</div>

  <h3 class="sub-head">What I work with</h3>
  <div>
    {{- range $p.skills }}
    <div class="skill-row">
      <span class="skill-group">{{ .group }}</span>
      <ul class="skill-items">{{ range .items }}<li>{{ . }}</li>{{ end }}</ul>
    </div>
    {{- end }}
  </div>
</section>
