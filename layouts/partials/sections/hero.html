{{- $p := site.Data.profile -}}
<section class="hero">
  <h1 class="hero-name display" data-split><span>Av</span><span>Akanksh</span></h1>

  <figure class="hero-figure">
    <img src="/images/profilePic.png" width="907" height="907"
         alt="Av Akanksh" fetchpriority="high">
  </figure>

  <div class="hero-meta">
    <div>
      <p class="hero-role">{{ $p.degree }}, {{ $p.dept }}, {{ $p.org }}.</p>
    </div>
    <div>
      <div class="hero-intro">{{ $p.intro | markdownify }}</div>
      <p class="hero-actions">
        <a class="btn btn-accent" href="#resumes">Résumés</a>
        <a class="btn" href="mailto:{{ $p.email }}">Email</a>
        <a class="btn" href="https://github.com/AvAkanksh" rel="noopener" target="_blank">GitHub</a>
      </p>
    </div>
  </div>
</section>
